; Worker de la cola: envía los correos (acuses, enlaces de contraseña, avisos).
; En la VM sí podemos tener un proceso permanente (en hosting compartido sería cron).
[program:portal-nep30-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/portal-nep30/artisan queue:work database --sleep=3 --tries=3 --backoff=60 --max-time=3600
directory=/var/www/portal-nep30
user=www-data
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=60
redirect_stderr=true
stdout_logfile=/var/www/portal-nep30/storage/logs/worker.log
