# Portal N.E.P. 30 - sitio de Nginx. Certbot agrega solo el bloque HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMINIO__;
    root /var/www/portal-nep30/public;
    index index.php index.html;
    charset utf-8;

    # Entregas de hasta 10 MB (RNF16) + margen del formulario
    client_max_body_size 12M;

    # Cabeceras de seguridad
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Archivos estáticos compilados por Vite: caché larga
    location /build/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    # Nunca servir archivos ocultos (.env, .git) ni nada fuera de /public
    location ~ /\.(?!well-known).* { deny all; }

    error_page 404 /index.php;
}
