name: Tests y deploy

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: portal_nep30_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s --health-timeout=5s --health-retries=5
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: portal_nep30_test
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_mysql, bcmath, intl, gd, zip
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Dependencias
        run: |
          composer install --no-interaction --prefer-dist
          npm ci

      - name: Preparar Laravel
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Compilar estilos y scripts
        run: npm run build

      # MySQL real (no SQLite): así se prueban también los triggers y las vistas.
      - name: Tests
        run: php artisan test

  deploy:
    needs: tests                    # si un test falla, no se publica
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    concurrency: produccion         # nunca dos deploys a la vez
    steps:
      - name: Deploy por SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          install -m 700 -d ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" "bash /var/www/portal-nep30/scripts/deploy.sh"
