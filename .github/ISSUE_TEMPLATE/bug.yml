name: Error (bug)
description: Algo que no funciona como dice el requerimiento. Registro de incidencias.
title: "[Bug] Descripción corta"
labels: ["bug"]
body:
  - type: input
    id: hu
    attributes:
      label: Historia o requerimiento afectado
      placeholder: "HU04 · RF06"
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      value: |
        1. 
        2. 
        3. 
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Qué debería pasar
    validations:
      required: true
  - type: textarea
    id: obtenido
    attributes:
      label: Qué pasa en cambio
      description: Mensaje de error, captura de pantalla o registro (storage/logs/laravel.log).
    validations:
      required: true
  - type: dropdown
    id: entorno
    attributes:
      label: Dónde ocurrió
      options: ["Local (develop)", "Prueba / demo", "Producción (main)"]
    validations:
      required: true
  - type: dropdown
    id: navegador
    attributes:
      label: Navegador o dispositivo
      options: ["Chrome", "Firefox", "Edge", "Safari (iOS)", "Celular Android", "No aplica"]
  - type: dropdown
    id: gravedad
    attributes:
      label: Gravedad
      description: "Crítico = impide usar una función o expone datos."
      options: ["Crítico", "Alto", "Medio", "Bajo"]
    validations:
      required: true
  - type: dropdown
    id: etapa
    attributes:
      label: Detectado en
      options: ["Desarrollo del sprint", "Testing interno (Etapa 6)", "Testing con la institución (Etapa 7)", "Producción"]
